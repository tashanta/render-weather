version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
          - noctx
    generated: lax

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yourusername/render-weather

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
